[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freelance-llm-api"
version = "0.1.0"
description = "Freelance LLM API Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "sse-starlette>=2.2.0",
    "psutil>=6.0.0",
]

[project.scripts]
freelance-api = "app.cli:main"
freelance-desktop = "app.desktop.__main__:main"

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7; python_version >= '3.10'"]
desktop-build = ["pyinstaller>=6.11,<7; python_version >= '3.10'"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.desktop" = ["default_config.yaml"]
