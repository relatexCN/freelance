# API Gateway Configuration
# Model routing: map model names to providers
# Format: "model_alias" -> provider + actual model name

providers:
  # Optional provider-level pass-through controls:
  # pass_through_body: false          # Forward the original JSON body after forcing model/stream.
  # header_passthrough: ["x-request-id", "re:^x-custom-"]
  # header_overrides:
  #   X-Provider-Feature: "enabled"
  #   X-Client-Trace: "{client_header:x-trace-id}"
  # disabled_fields: ["stream_options.include_obfuscation", "service_tier"]
  # param_overrides:
  #   - { op: "set", path: "reasoning.enabled", value: true }
  #   - { op: "delete", path: "temperature" }
  ollama:
    type: openai
    base_url: https://ollama.com/v1
    api_key: ${OLLAMA_API_KEY:}
    timeout: 120
    default_model: nemotron-3-ultra  # Auto模式下使用的默认模型

  openrouter:
    type: openai
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY:}
    timeout: 120
    default_model: nvidia/nemotron-3-ultra-550b-a55b:free  # Auto模式下使用的默认模型

  groq:
    type: openai
    base_url: https://api.groq.com/openai/v1/responses
    api_key: ${GROQ_API_KEY:}
    timeout: 60
    score_offset: 0.5  # Boost Groq models due to extreme low latency
    default_model: groq/compound

  cerebras:
    type: openai
    base_url: https://api.cerebras.ai/v1
    api_key: ${CEREBRAS_API_KEY:}
    timeout: 60

  sambanova:
    type: openai
    base_url: https://api.sambanova.ai/v1
    api_key: ${SAMBANOVA_API_KEY:}
    timeout: 60

  nvidia:
    type: openai
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY:}
    timeout: 250
    default_model: openai/gpt-oss-120b

  mistral:
    type: openai
    base_url: https://api.mistral.ai/v1
    api_key: ${MISTRAL_API_KEY:}
    timeout: 60

  hyperbolic:
    type: openai
    base_url: https://api.hyperbolic.xyz/v1
    api_key: ${HYPERBOLIC_API_KEY:}
    timeout: 60

  novita:
    type: openai
    base_url: https://api.novita.ai/v1
    api_key: ${NOVITA_API_KEY:}
    timeout: 60

  nebius:
    type: openai
    base_url: https://api.nebius.ai/v1
    api_key: ${NEBIUS_API_KEY:}
    timeout: 60

  google-gemini:
    type: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key: ${GEMINI_API_KEY:}
    timeout: 300

  agnes-ai:
    type: openai
    base_url: https://apihub.agnes-ai.com/v1
    api_key: ${AGNES_API_KEY:}
    timeout: 60
    default_model: agnes-2.0-flash

# Model routing rules
# When a client requests a model, it will be routed to the specified provider
# If no route matches, the default provider will be used
models:
  # Ollama models
  "llama3": { provider: "ollama", model: "llama3" }
  "llama3:8b": { provider: "ollama", model: "llama3:8b" }
  "llama3:70b": { provider: "ollama", model: "llama3:70b" }
  "qwen2.5": { provider: "ollama", model: "qwen2.5" }
  "qwen2.5:72b": { provider: "ollama", model: "qwen2.5:72b" }
  "deepseek-r1": { provider: "ollama", model: "deepseek-r1" }
  "gemma2": { provider: "ollama", model: "gemma2" }
  "mistral": { provider: "ollama", model: "mistral" }
  "codellama": { provider: "ollama", model: "codellama" }

  # OpenRouter models
  "gpt-4o": { provider: "openrouter", model: "openai/gpt-4o" }
  "gpt-4o-mini": { provider: "openrouter", model: "openai/gpt-4o-mini" }
  "claude-3.5-sonnet": { provider: "openrouter", model: "anthropic/claude-3.5-sonnet" }
  "claude-3-opus": { provider: "openrouter", model: "anthropic/claude-3-opus" }
  "gemini-pro": { provider: "openrouter", model: "google/gemini-pro-1.5" }
  "deepseek-chat": { provider: "openrouter", model: "deepseek/deepseek-chat" }

  # Agnes-ai models
  "agnes-2.0-flash": { provider: "agnes-ai", model: "agnes-2.0-flash" }
  "agnes-image-2.0-flash": { provider: "agnes-ai", model: "agnes-image-2.0-flash" }
  "agnes-image-2.1-flash": { provider: "agnes-ai", model: "agnes-image-2.1-flash" }
  "agnes-video-v2.0": { provider: "agnes-ai", model: "agnes-video-v2.0" }

# Default provider when model is not found in routing table
# default_provider: "ollama"

# Global settings
settings:
  # 最大重试次数
  max_retries: 2
  # 统一超时时间（秒），null表示使用各提供商默认超时
  # 默认为20秒
  unified_timeout: 180
  
  # 融断与冷却设置（秒）
  cooldown:
    rate_limit_429: 1800      # 30分钟
    auth_error_401: 10800     # 3小时
    forbidden_403: 10800      # 3小时
    quota_exceeded: 3600      # 1小时
    timeout_network: 3600     # 1小时
    stream_failure_fallback: 3600 # 1小时 (流式失败但非流式成功时禁用流式的时长)
    other_error: 3600        # 1小时
    provider_melt: 3600      # 1小时

  # 上游错误策略：用 HTTP 状态码范围控制重试和冷却粒度
  # 范围示例: "429,500-503,505-599"
  error_policy:
    retry_status_codes: "401-407,409-499,500-503,505-599"
    skip_retry_status_codes: "400,408,422,504,524"
    disable_key_status_codes: "401,403"
    disable_model_status_codes: "404"
    disable_provider_status_codes: ""

  # Tool-call handling:
  # passthrough  - forward OpenAI tools/tool_calls without local execution (default)
  # local_agent  - execute supported local tools inside this gateway
  # disabled     - remove tool controls before sending requests upstream
  tools:
    mode: passthrough

  # SSE 探测与优化设置
  stream_probe:
    small_model_timeout: 120       # 8B 级别首包超时
    large_model_timeout: 180       # 40B/70B 级别首包超时
    xlarge_model_timeout: 240      # 100B-500B 级别首包超时
    defunct_model_timeout: 60    # 无法识别级别的模型首包超时
    huge_model_read_timeout: 180  # 超大模型(500B+)读取超时
    ping_interval: 3              # 心跳间隔 (秒)
    read_timeout: 180            # 读取超时 - 数据块之间的最大间隔时间(秒)
  
  # HTTP 连接池物理隔离设置
  connection_pool:
    stream:
      max_connections: 100
      max_keepalive: 50
      keepalive_expiry: 600   # 长连接保活 (秒)
    batch:
      max_connections: 200
      max_keepalive: 100
      keepalive_expiry: 60    # 短请求快速复用
